<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밥 먹을거야?</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-slate-50 to-pink-50 min-h-screen text-slate-800 flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl shadow-xl p-6 sm:p-8 border border-white/80">
        
        <!-- 상단 타이틀 및 공유 버튼 -->
        <div class="flex justify-between items-center mb-5">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">🍚 밥 먹을거야?</h1>
                <p class="text-xs text-slate-400 mt-1">전주기전여고 실시간 급식 연동</p>
            </div>
            <button onclick="copyLink()" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3.5 py-2.5 rounded-2xl text-xs font-semibold transition flex items-center gap-1 shadow-sm">
                🔗 공유
            </button>
        </div>

        <!-- 전주기전여고 오늘 급식 메뉴 배너 -->
        <div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200/60 rounded-2xl p-4 mb-5 shadow-sm">
            <div class="flex items-center justify-between mb-1">
                <span class="text-[11px] font-bold text-amber-600 uppercase tracking-wider">✨ 전주기전여고 오늘의 급식</span>
                <span class="text-xl">😋</span>
            </div>
            <div id="todayMeal" class="text-sm font-semibold text-slate-700 leading-relaxed">
                급식 정보를 불러오는 중...
            </div>
        </div>

        <!-- 탭 전환 버튼 (점심 체크 / 저메추) -->
        <div class="flex bg-slate-100 p-1 rounded-2xl mb-5">
            <button onclick="switchTab('lunch')" id="tabLunchBtn" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition bg-white text-indigo-600 shadow-sm">
                🍱 점심 밥 친구
            </button>
            <button onclick="switchTab('dinner')" id="tabDinnerBtn" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition text-slate-500">
                🌙 저메추 (저녁 추천)
            </button>
        </div>

        <!-- [탭 1] 점심 밥 친구 영역 -->
        <div id="lunchSection">
            <!-- 이름 등록 입력창 -->
            <div class="flex gap-2 mb-5">
                <input type="text" id="nameInput" placeholder="이름을 입력하세요" 
                    class="flex-1 px-4 py-3.5 bg-slate-50/80 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition"
                    onkeypress="if(event.key === 'Enter') addParticipant()">
                <button onclick="addParticipant()" 
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-3.5 rounded-2xl text-sm transition shadow-md shadow-indigo-100">
                    등록
                </button>
            </div>

            <!-- 요약 현황판 -->
            <div class="grid grid-cols-2 gap-3 mb-5">
                <div class="bg-gradient-to-br from-emerald-50 to-teal-50/50 border border-emerald-100/80 rounded-2xl p-4 text-center">
                    <span class="text-xs font-semibold text-emerald-600 block mb-1">먹어요 (Yes)</span>
                    <span id="yesCount" class="text-2xl font-bold text-emerald-700">0명</span>
                </div>
                <div class="bg-gradient-to-br from-rose-50 to-pink-50/50 border border-rose-100/80 rounded-2xl p-4 text-center">
                    <span class="text-xs font-semibold text-rose-600 block mb-1">안 먹어요 (No)</span>
                    <span id="noCount" class="text-2xl font-bold text-rose-700">0명</span>
                </div>
            </div>

            <!-- 참가자 리스트 영역 -->
            <div>
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 flex items-center justify-between px-1">
                    <span>참석 명단 (이름을 눌러 상태 변경)</span>
                    <span id="statusText" class="text-[11px] text-slate-400 font-normal">동기화 대기중...</span>
                </h2>
                <div id="participantList" class="space-y-2.5 max-h-72 overflow-y-auto pr-1">
                    <!-- 동적 생성 -->
                </div>
            </div>
        </div>

        <!-- [탭 2] 저메추 (저녁 추천) 영역 -->
        <div id="dinnerSection" class="hidden">
            <!-- 메뉴 추천 입력창 -->
            <div class="flex gap-2 mb-5">
                <input type="text" id="menuInput" placeholder="추천할 저녁 메뉴 입력 (예: 마라탕)" 
                    class="flex-1 px-4 py-3.5 bg-slate-50/80 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm transition"
                    onkeypress="if(event.key === 'Enter') addDinnerMenu()">
                <button onclick="addDinnerMenu()" 
                    class="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-5 py-3.5 rounded-2xl text-sm transition shadow-md shadow-purple-100">
                    추천
                </button>
            </div>

            <!-- 저녁 메뉴 추천 리스트 -->
            <div>
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3 px-1">
                    <span>메뉴 카드를 누르면 내 이름을 넣고 하트를 남길 수 있어요!</span>
                </h2>
                <div id="dinnerList" class="space-y-2.5 max-h-72 overflow-y-auto pr-1">
                    <!-- 동적 생성 -->
                </div>
            </div>
        </div>

    </div>

    <!-- 스크립트 로직 -->
    <script>
        // 💡 JSONBin 설정
        const BIN_ID = '6ace4e54ac6210605a2e0edc'; 
        const API_KEY = '$2a$10$kc4RQI/uq571j1l1LesOK.nrzIfSLf.FnK7dExT7IU.pgZlDYHZqO'; 
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // 전주기전여자고등학교 나이스 API 정보
        const ATPT_OFCDC_SC_CODE = 'P10'; 
        const SD_SCHUL_CODE = 'P100000419'; 

        // 탭 전환 함수
        function switchTab(tab) {
            const lunchBtn = document.getElementById('tabLunchBtn');
            const dinnerBtn = document.getElementById('tabDinnerBtn');
            const lunchSec = document.getElementById('lunchSection');
            const dinnerSec = document.getElementById('dinnerSection');

            if (tab === 'lunch') {
                lunchBtn.className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition bg-white text-indigo-600 shadow-sm";
                dinnerBtn.className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition text-slate-500";
                lunchSec.classList.remove('hidden');
                dinnerSec.classList.add('hidden');
            } else {
                dinnerBtn.className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition bg-white text-purple-600 shadow-sm";
                lunchBtn.className = "flex-1 py-2.5 text-xs font-bold rounded-xl transition text-slate-500";
                dinnerSec.classList.remove('hidden');
                lunchSec.classList.add('hidden');
            }
        }

        // 나이스 API 급식 정보 가져오기 (오류 및 예외 처리 강화)
        async function fetchSchoolMeal() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const kstTime = new Date(utc + (9 * 3600000));
            
            const year = kstTime.getFullYear();
            const month = String(kstTime.getMonth() + 1).padStart(2, '0');
            const day = String(kstTime.getDate()).padStart(2, '0');
            const todayYmd = `${year}${month}${day}`;

            const mealUrl = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&ATPT_OFCDC_SC_CODE=${ATPT_OFCDC_SC_CODE}&SD_SCHUL_CODE=${SD_SCHUL_CODE}&MLSV_YMD=${todayYmd}`;

            try {
                const response = await fetch(mealUrl);
                const data = await response.json();
                
                if (data.RESULT && data.RESULT.CODE === 'INFO-200') {
                    document.getElementById('todayMeal').innerText = '오늘 등록된 급식 식단이 없습니다. (주말 또는 공휴일)';
                    return;
                }

                if (data.mealServiceDietInfo) {
                    const rows = data.mealServiceDietInfo[1].row;
                    const lunch = rows.find(item => item.MMEAL_SC_CODE === '2');
                    
                    if (lunch) {
                        let menuText = lunch.DDISH_NM.replace(/<br\/?>/g, '<br>');
                        menuText = menuText.replace(/\([^)]*?\)/g, '').replace(/\d+\./g, '');
                        document.getElementById('todayMeal').innerHTML = menuText;
                    } else {
                        document.getElementById('todayMeal').innerText = '오늘의 중식 식단이 없습니다.';
                    }
                } else {
                    document.getElementById('todayMeal').innerText = '급식 정보를 불러오지 못했습니다.';
                }
            } catch (e) {
                document.getElementById('todayMeal').innerText = '급식 정보를 불러오는 중 오류가 발생했습니다.';
            }
        }

        // 한국 시간 기준 슬롯 계산 (오전 8시, 오후 1시 전체 초기화)
        function getKSTDetails() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const kstTime = new Date(utc + (9 * 3600000));
            const year = kstTime.getFullYear();
            const month = kstTime.getMonth();
            const day = kstTime.getDate();
            const hour = kstTime.getHours();

            let slot = 'morning_0800';
            if (hour < 8) slot = 'early';
            else if (hour >= 13) slot = 'afternoon_1300';

            return { dateStr: `${year}-${month}-${day}`, slot };
        }

        // 클라우드 데이터 불러오기
        async function loadData() {
            if (BIN_ID.includes('여기에')) {
                document.getElementById('statusText').innerText = '코드 상단에 BIN_ID와 API_KEY를 입력해주세요';
                return;
            }

            try {
                const response = await fetch(API_URL + '/latest', {
                    headers: { 'X-Master-Key': API_KEY }
                });
                if (!response.ok) throw new Error('데이터 로드 실패');
                
                const json = await response.json();
                const data = json.record || { lastResetSlot: '', participants: [], dinnerMenus: [] };
                const kst = getKSTDetails();
                let participants = data.participants || [];
                let dinnerMenus = data.dinnerMenus || [];

                const currentSlotStr = `${kst.dateStr}_${kst.slot}`;
                if (data.lastResetSlot !== currentSlotStr) {
                    participants = []; 
                    await saveDataToCloud(participants, dinnerMenus, currentSlotStr);
                } else {
                    render(participants, dinnerMenus);
                }
                document.getElementById('statusText').innerText = '실시간 동기화됨 ✓';
            } catch (e) {
                document.getElementById('statusText').innerText = '서버 연결 지연 중...';
            }
        }

        // 클라우드에 데이터 저장하기
        async function saveDataToCloud(participants, dinnerMenus, customSlot = null) {
            const kst = getKSTDetails();
            const slotToSave = customSlot || `${kst.dateStr}_${kst.slot}`;
            const payload = {
                lastResetSlot: slotToSave,
                participants: participants,
                dinnerMenus: dinnerMenus
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('저장 실패');
                render(participants, dinnerMenus);
            } catch (e) {
                alert('데이터 저장 중 오류가 발생했습니다.');
            }
        }

        async function fetchCurrentData() {
            try {
                const response = await fetch(API_URL + '/latest', {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const json = await response.json();
                return json.record || { participants: [], dinnerMenus: [] };
            } catch (e) {
                return { participants: [], dinnerMenus: [] };
            }
        }

        // 점심 이름 등록
        async function addParticipant() {
            const input = document.getElementById('nameInput');
            const name = input.value.trim();
            if (!name) { alert('이름을 입력해주세요!'); return; }

            let current = await fetchCurrentData();
            let participants = current.participants || [];

            if (participants.some(p => p.name === name)) {
                alert('이미 등록된 이름입니다.');
                return;
            }

            participants.push({ name: name, status: 'yes' });
            input.value = '';
            await saveDataToCloud(participants, current.dinnerMenus || []);
        }

        // 점심 상태 토글
        async function toggleStatus(index) {
            let current = await fetchCurrentData();
            let participants = current.participants || [];
            participants[index].status = participants[index].status === 'yes' ? 'no' : 'yes';
            await saveDataToCloud(participants, current.dinnerMenus || []);
        }

        // 점심 명단 삭제
        async function deleteParticipant(event, index) {
            event.stopPropagation();
            if (!confirm('정말 삭제하시겠습니까?')) return;

            let current = await fetchCurrentData();
            let participants = current.participants || [];
            participants.splice(index, 1);
            await saveDataToCloud(participants, current.dinnerMenus || []);
        }

        // 저메추 메뉴 추가
        async function addDinnerMenu() {
            const input = document.getElementById('menuInput');
            const menuName = input.value.trim();
            if (!menuName) { alert('추천할 메뉴를 입력해주세요!'); return; }

            let current = await fetchCurrentData();
            let dinnerMenus = current.dinnerMenus || [];

            if (dinnerMenus.some(m => m.name === menuName)) {
                alert('이미 등록된 메뉴입니다!');
                return;
            }

            dinnerMenus.push({ name: menuName, voters: [] });
            input.value = '';
            await saveDataToCloud(current.participants || [], dinnerMenus);
        }

        // 저메추 하트 누르기
        async function voteDinner(index) {
            const voterName = prompt('추천하는 본인 이름을 입력해주세요:');
            if (!voterName || !voterName.trim()) return;

            let current = await fetchCurrentData();
            let dinnerMenus = current.dinnerMenus || [];
            let menu = dinnerMenus[index];

            if (!menu.voters) menu.voters = [];

            const cleanName = voterName.trim();
            if (menu.voters.includes(cleanName)) {
                alert('이미 이 메뉴에 하트를 남기셨습니다!');
                return;
            }

            menu.voters.push(cleanName);
            await saveDataToCloud(current.participants || [], dinnerMenus);
        }

        // 저메추 메뉴 삭제
        async function deleteDinnerMenu(event, index) {
            event.stopPropagation();
            if (!confirm('이 추천 메뉴를 삭제하시겠습니까?')) return;

            let current = await fetchCurrentData();
            let dinnerMenus = current.dinnerMenus || [];
            dinnerMenus.splice(index, 1);
            await saveDataToCloud(current.participants || [], dinnerMenus);
        }

        // 화면 렌더링
        function render(participants, dinnerMenus) {
            // 1. 점심 리스트 렌더링
            const listEl = document.getElementById('participantList');
            listEl.innerHTML = '';
            let yesCount = 0, noCount = 0;

            if (participants.length === 0) {
                listEl.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">아직 등록된 사람이 없습니다.</div>`;
            }

            participants.forEach((p, index) => {
                if (p.status === 'yes') yesCount++; else noCount++;
                const isYes = p.status === 'yes';
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-3.5 rounded-2xl border transition cursor-pointer shadow-sm ${
                    isYes ? 'bg-emerald-50/40 border-emerald-200/80 hover:bg-emerald-50/70' : 'bg-slate-50/60 border-slate-200/80 hover:bg-slate-50'
                }`;
                item.onclick = () => toggleStatus(index);

                item.innerHTML = `
                    <span class="font-semibold text-slate-700 text-sm pl-1">${p.name}</span>
                    <div class="flex items-center gap-2">
                        <span class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                            isYes ? 'bg-emerald-600 text-white shadow-sm shadow-emerald-100' : 'bg-slate-200/80 text-slate-600'
                        }">
                            ${isYes ? '🍚 YES' : '❌ NO'}
                        </span>
                        <button onclick="deleteParticipant(event, ${index})" class="p-1.5 text-slate-400 hover:text-rose-500 transition rounded-xl hover:bg-rose-50" title="삭제">
                            🗑️
                        </button>
                    </div>
                `;
                listEl.appendChild(item);
            });

            document.getElementById('yesCount').innerText = `${yesCount}명`;
            document.getElementById('noCount').innerText = `${noCount}명`;

            // 2. 저메추 리스트 렌더링
            const dinnerListEl = document.getElementById('dinnerList');
            dinnerListEl.innerHTML = '';
            
            dinnerMenus.sort((a, b) => ((b.voters ? b.voters.length : 0) - (a.voters ? a.voters.length : 0)));

            if (dinnerMenus.length === 0) {
                dinnerListEl.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm">추천된 저녁 메뉴가 없습니다. 메뉴를 제안해보세요!</div>`;
            }

            dinnerMenus.forEach((d, index) => {
                const voters = d.voters || [];
                const voteCount = voters.length;

                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3.5 rounded-2xl border bg-purple-50/30 border-purple-100 hover:bg-purple-50/60 transition cursor-pointer shadow-sm";
                item.onclick = () => voteDinner(index);

                item.innerHTML = `
                    <div class="flex flex-col">
                        <span class="font-semibold text-slate-700 text-sm pl-1">🔥 ${d.name}</span>
                        ${voteCount > 0 ? `<span class="text-[11px] text-purple-600 pl-1 mt-0.5">추천: ${voters.join(', ')}</span>` : ''}
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="px-3 py-1.5 rounded-xl text-xs font-bold bg-purple-600 text-white shadow-sm shadow-purple-100 flex items-center gap-1">
                            ❤️ ${voteCount}
                        </span>
                        <button onclick="deleteDinnerMenu(event, ${index})" class="p-1.5 text-slate-400 hover:text-rose-500 transition rounded-xl hover:bg-rose-50" title="삭제">
                            🗑️
                        </button>
                    </div>
                `;
                dinnerListEl.appendChild(item);
            });
        }

        // 링크 복사 함수
        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('링크가 복사되었습니다!');
            }).catch(() => {
                prompt('링크를 복사해주세요:', window.location.href);
            });
        }

        // 최초 실행
        fetchSchoolMeal();
        setInterval(loadData, 3000);
        loadData();
    </script>
</body>
</html>
